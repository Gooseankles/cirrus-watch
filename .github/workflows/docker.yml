name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: trozity
  IMAGE: trozity/azure-ops-dashboard
  # Trivy runs from its official image pinned by digest (0.56.2), not from
  # trivy-action: that action's tags were hijacked in March 2026.
  TRIVY: aquasec/trivy@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Trivy results in the Security tab
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr

      # Build once into the local Docker, scan it, and push only if it passes.
      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (all findings, for the Security tab)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln --format sarif --output trivy.sarif "scan-target:${{ github.sha }}"

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
        continue-on-error: true

      # Fails the build on critical or high problems that have a fix. Ones with
      # no fix yet are in the Security tab but do not block. An accepted one
      # goes in .trivyignore with a reason.
      - name: Trivy gate (critical and high with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 "scan-target:${{ github.sha }}"

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags each new VERSION on main as v<version> (e.g. for Terraform module ?ref=).
  tag-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag if missing
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
