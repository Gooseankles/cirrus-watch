name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly rebuild: takes Alpine and Node patches and the Dependabot updates
  # merged on Monday, and runs the Trivy gate against new CVEs. A failed
  # rebuild pushes nothing and shows as a failed run.
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: trozity
  IMAGE: trozity/azure-ops-dashboard
  # Trivy runs from its official image pinned by digest (0.76.1), not from
  # trivy-action: that action's tags were hijacked in March 2026.
  TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

permissions:
  contents: read

jobs:
  # The unit tests (node:test, no Azure) must pass before an image is built.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Trivy results in the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr

      # Build once into the local Docker, scan it, and push only if it passes.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (all findings, for the Security tab)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln --format sarif --output trivy.sarif "scan-target:${{ github.sha }}"

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
        continue-on-error: true

      # Fails the build on critical or high problems that have a fix. Ones with
      # no fix yet are in the Security tab but do not block. An accepted one
      # goes in .trivyignore with a reason.
      - name: Trivy gate (critical and high with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 "scan-target:${{ github.sha }}"

      # The pushed image carries an SBOM (the packages inside it) and SLSA
      # provenance (how and from which commit it was built) as attestations;
      # `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'`
      # reads them. The scan build above loads into the local Docker, which
      # cannot hold attestations, so only this step has them.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags each new VERSION on main as v<version>.
  tag-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag if missing
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
