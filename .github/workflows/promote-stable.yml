name: Promote to stable

# Run by hand once an image has been used long enough: points the "stable" tag
# at the image another tag (default "latest") names. Nothing is rebuilt; the
# exact same image gets one more tag.
# Then it calls the deploy webhook of every App Service that runs :stable with
# continuous deployment on (the Terraform module's continuous_deployment and its
# deploy_webhook_url output), one URL per line in the STABLE_DEPLOY_WEBHOOKS
# secret, so those sites pull the new stable at once.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Tag to promote (latest or a version like 0.7.0.0)"
        required: true
        default: latest

env:
  DOCKERHUB_USERNAME: trozity
  IMAGE: trozity/azure-ops-dashboard

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point stable at ${{ inputs.source }}
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' | jq -r .digest; }

          new=$(digest "$SOURCE")
          old=$(digest stable 2>/dev/null || echo none)
          # The other tags on the same image, so the summary says which version this is.
          tags=$(curl -fsS "https://hub.docker.com/v2/repositories/$IMAGE/tags?page_size=100" \
            | jq -r --arg d "$new" '[.results[] | select(.digest == $d) | .name] | join(", ")')

          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE@$new"

          {
            echo "### stable -> \`$SOURCE\`"
            echo "- Image: \`$new\`"
            echo "- Same image as: $tags"
            echo "- Previous stable: \`$old\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "stable now $new ($tags), was $old"

      - name: Tell App Services to pull the new stable
        env:
          HOOKS: ${{ secrets.STABLE_DEPLOY_WEBHOOKS }}
        run: |
          if [ -z "$HOOKS" ]; then echo "No STABLE_DEPLOY_WEBHOOKS secret; nothing to call."; exit 0; fi
          n=0; failed=0
          while IFS= read -r url; do
            url=$(echo "$url" | tr -d '[:space:]')
            [ -z "$url" ] && continue
            n=$((n + 1))
            # The URL holds the site's deploy password: never echo it.
            if curl -fsS -o /dev/null -X POST --max-time 60 "$url"; then echo "Site $n: deploy started"; else echo "Site $n: webhook failed"; failed=$((failed + 1)); fi
          done <<< "$HOOKS"
          echo "- Deploy webhooks called: $n, failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
