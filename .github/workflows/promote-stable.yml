name: Promote to stable

# Run by hand once an image has been used long enough: points the "stable" tag
# at the image another tag (default "latest") names. Nothing is rebuilt; the
# exact same image gets one more tag. The image must carry a valid cosign
# signature from this repo's docker.yml on main (or a v* tag), or nothing moves.
# Images up to 0.64.1.0 were pushed before signing and cannot be promoted.
# Then it restarts every App Service listed in the STABLE_DEPLOYMENTS variable
# (the Terraform module's continuous_deployment and its stable_deployment
# output), so they pull the new stable at once. It signs in to Azure with
# GitHub's OIDC token as each app's deploy identity: no password anywhere.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Tag to promote (latest or a version like 0.7.0.0)"
        required: true
        default: latest

env:
  DOCKERHUB_USERNAME: trozity
  IMAGE: trozity/azure-ops-dashboard

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point stable at ${{ inputs.source }}
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' | jq -r .digest; }

          new=$(digest "$SOURCE")
          old=$(digest stable 2>/dev/null || echo none)
          # The other tags on the same image, so the summary says which version this is.
          tags=$(curl -fsS "https://hub.docker.com/v2/repositories/$IMAGE/tags?page_size=100" \
            | jq -r --arg d "$new" '[.results[] | select(.digest == $d) | .name] | join(", ")')

          # Only an image this repo's docker.yml built and signed (keyless, Sigstore) may become stable.
          # Checked by digest, the same digest that gets the tag below.
          if ! cosign verify "$IMAGE@$new" \
            --certificate-identity-regexp '^https://github\.com/Gooseankles/cirrus-watch/\.github/workflows/docker\.yml@refs/(heads/main|tags/v.+)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
            echo "::error::$IMAGE@$new ($tags) has no valid signature from docker.yml; stable not moved. Images up to 0.64.1.0 are unsigned."
            exit 1
          fi

          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE@$new"

          {
            echo "### stable -> \`$SOURCE\`"
            echo "- Image: \`$new\` (signature verified)"
            echo "- Same image as: $tags"
            echo "- Previous stable: \`$old\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "stable now $new ($tags), was $old"

  # One run per app in STABLE_DEPLOYMENTS, a repository variable (IDs and names,
  # no secret: access comes from each app's federated credential, which trusts
  # only this repo's "stable" environment). Format, from the module's
  # stable_deployment output:
  # [{"clientId":"…","tenantId":"…","subscriptionId":"…","resourceGroup":"…","name":"…"}]
  # Empty or unset: this job is skipped. A restart makes App Service pull the
  # image again, so it gets the new stable.
  restart:
    needs: promote
    if: vars.STABLE_DEPLOYMENTS != '' && vars.STABLE_DEPLOYMENTS != '[]'
    name: Restart ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      id-token: write # GitHub's OIDC token, exchanged for the app's deploy identity
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(vars.STABLE_DEPLOYMENTS) }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ matrix.app.clientId }}
          tenant-id: ${{ matrix.app.tenantId }}
          subscription-id: ${{ matrix.app.subscriptionId }}

      - name: Restart
        env:
          RG: ${{ matrix.app.resourceGroup }}
          APP: ${{ matrix.app.name }}
        run: |
          set -euo pipefail
          az webapp restart --resource-group "$RG" --name "$APP"
          echo "- $APP restarted; it pulls the new stable now" >> "$GITHUB_STEP_SUMMARY"
