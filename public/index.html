<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Azure ops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233987e5'/%3E%3Cpath d='M12 5L5 8.5l7 3.5 7-3.5-7-3.5zM5 15.5l7 3.5 7-3.5M5 12l7 3.5 7-3.5' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <div><div class="brand-name">Azure ops</div><div class="brand-sub">tenant dashboard</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="whoami">
        <div class="avatar" id="me-avatar"></div>
        <div style="min-width:0"><div class="whoami-name" id="me-name">…</div><div class="whoami-role" id="me-role"></div></div>
      </div>
      <div class="whoami-actions">
        <span class="version" id="me-version"></span>
        <a href="/auth/logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</a>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="brand"><div class="brand-name">Azure ops</div></div>
    </div>
    <nav class="tenant-tabs hidden" id="tenant-tabs" role="tablist" aria-label="Tenant"></nav>

    <section class="page" id="page-overview"></section>
    <section class="page" id="page-lookup">
      <div class="page-head">
        <div><h1>Access lookup</h1><p class="page-sub">Every Azure role a person holds, directly or through a group, across all subscriptions.</p></div>
      </div>
      <div class="card">
        <form class="lookup-form" id="lookup-form" autocomplete="off">
          <input class="input" id="lookup-upn" type="text" placeholder="user@contoso.com" aria-label="User principal name" required />
          <button class="btn primary" id="lookup-btn" type="submit">Look up</button>
          <span class="status-msg" id="lookup-status"></span>
        </form>
      </div>
      <div id="lookup-result"></div>
    </section>
    <section class="page" id="page-scan"></section>
    <section class="page" id="page-cost"></section>
    <section class="page" id="page-report"></section>
    <section class="page" id="page-audit"></section>
    <section class="page" id="page-settings"></section>
  </main>

  <script src="/charts.js"></script>
  <script src="/compliance.js"></script>
  <script src="/app.js"></script>
  <script src="/cost.js"></script>
  <script src="/report.js"></script>
  <script src="/settings.js"></script>
  <script src="/audit.js"></script>
</body>
</html>
